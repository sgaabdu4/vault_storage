name: Auto-merge Dependabot PRs

on: pull_request

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Queue Dependabot auto-merge
    if: github.event.pull_request.user.id == 49699333 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # Merge dependency updates after required checks pass.
      pull-requests: write # Enable auto-merge on Dependabot pull requests.
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
