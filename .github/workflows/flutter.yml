name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the package source for checks.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          # Extract version from pubspec.yaml
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          echo "Version in pubspec.yaml: $PUBSPEC_VERSION"
          
          # Extract version from CHANGELOG.md (first occurrence of ## [version])
          CHANGELOG_VERSION=$(grep -m 1 '## \[' CHANGELOG.md | sed 's/.*\[\(.*\)\].*/\1/' | tr -d '\r')
          echo "Version in CHANGELOG.md: $CHANGELOG_VERSION"
          
          # Compare versions
          if [ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   pubspec.yaml: $PUBSPEC_VERSION"
            echo "   CHANGELOG.md: $CHANGELOG_VERSION"
            echo ""
            echo "Please ensure the version in CHANGELOG.md matches pubspec.yaml"
            exit 1
          else
            echo "✅ Version consistency check passed: $PUBSPEC_VERSION"
          fi

  verify:
    name: Hard Eng checks
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Read source and release metadata for the gates.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: "12.4.1"
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install coverage merger
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Install package dependencies
        run: flutter pub get
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Run native project checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .hooks/hard-eng.py check --base "$BASE_SHA"

  format:
    name: Check Formatting
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify native checks succeeded
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

  analyze:
    name: Analyze Code
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify native checks succeeded
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

  test:
    name: Run Tests
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify native checks succeeded
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

  pana:
    name: Package Analysis (PANA)
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the package source for checks.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Activate PANA
        run: dart pub global activate pana

      - name: Run PANA analysis and check score
        run: |
          RESULT=$(dart pub global run pana . --json)
          SCORE=$(echo "$RESULT" | jq '.scores.grantedPoints')
          TOTAL=$(echo "$RESULT" | jq '.scores.maxPoints')
          echo "PANA Score: $SCORE/$TOTAL"
          if [ "$SCORE" -lt "$TOTAL" ]; then
            echo "$RESULT" | jq '.suggestions'
            echo "❌ PANA analysis failed. Score: $SCORE/$TOTAL"
            echo "Package must achieve maximum PANA score including WASM compatibility"
            exit 1
          else
            echo "✅ PANA analysis passed. Perfect score: $SCORE/$TOTAL"
          fi

  tag:
    name: Auto-Tag Release
    environment: package-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version-check, format, analyze, test, pana]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag and GitHub release.
    outputs:
      tag_created: ${{ steps.tag.outputs.tag_created }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag if version changed
        id: tag
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Tag $TAG already exists — skipping"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$RELEASE_PAT" ]; then
            echo "❌ RELEASE_PAT is required to create a trusted release tag"
            echo "Add a fine-grained repository token with Contents write access"
            exit 1
          else
            echo "🏷️ Creating tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_PAT" | base64 -w0)" push origin "$TAG"
            echo "✅ Tag $TAG created and pushed"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with changelog
        if: steps.tag.outputs.tag_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          TAG="v$VERSION"
          awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 {found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md > /tmp/release_notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md

  # Publishing is handled by publish.yml after RELEASE_PAT pushes the tag.
  # Pub.dev only trusts workflows triggered by real tag-push events.
