include: ../analysis_options.yaml

analyzer:
  exclude:
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-inference: true

linter:
  rules:
    no_dynamic_casts: true
    no_raw_types: true
    avoid_annotating_with_dynamic: true
    avoid_dynamic_calls: true
    strict_top_level_inference: true
    unawaited_futures: true
